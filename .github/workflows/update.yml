name: Update Football News

# This workflow has no schedule of its own. It runs only when something asks
# it to.
#
# The timing lives in a Cloudflare Worker instead, which calls
# workflow_dispatch on a real schedule. GitHub's own cron turned out to be the
# wrong tool: it never fired at all for the first day, and it runs on a shared
# best-effort queue that drops runs under load rather than queueing them. One
# clock is also easier to reason about than two — when something runs too
# often or not at all, there's only one place to look.
#
# If you ever want GitHub to schedule this again, put the block back:
#
#   schedule:
#     - cron: "7,37 * * * *"        # avoid :00 and :30, GitHub's busiest minutes
#
on:
  push:
    branches: [main]        # redeploy straight away when you change the app
    # Ignore the bot's own commits, so a run can't retrigger itself. The commit
    # message also carries [skip ci]; this is the belt to that pair of braces.
    paths-ignore: ["**.md", "posts.json"]
  workflow_dispatch:        # the Cloudflare Worker, and the Run workflow button

# Only one run at a time, so two runs can't both try to commit posts.json.
concurrency:
  group: update-posts
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit posts.json back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new posts from Telegram
        env:
          TG_CHANNEL: fabrizioromanotg
          MAX_POSTS: "800"
          BACKFILL_PAGES: "15"    # only used on a cold start, ~300 posts
        run: python3 fetch_posts.py

      - name: Commit posts.json if it changed
        run: |
          if git diff --quiet -- posts.json; then
            echo "no change — nothing to commit"
            exit 0
          fi
          git config user.name  "football-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "posts: $(python3 -c 'import json;print(len(json.load(open("posts.json"))))') total [skip ci]"
          # another run may have pushed while we were working — rebase and retry
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push failed, retry $i"; sleep 5
          done
          exit 1

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}       # pick up the commit the fetch job just made
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
