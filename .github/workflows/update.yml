name: Update Romano Tracker

# Every 30 minutes. The source is Fabrizio Romano's public Telegram channel,
# so there's no API key and nothing to pay — the only limit is politeness.
#
# Why 30 and not 15: GitHub runs scheduled jobs on a shared, best-effort queue.
# They routinely start 5–20 minutes late, and when the platform is busy the
# tightest schedules get dropped altogether rather than queued. Asking for every
# 30 minutes reliably gives you roughly every 30 minutes; asking for every 15
# often gives you fewer runs than this does. Nothing is lost by waiting either —
# each run picks up every post since the last one.
#
# Two more things worth knowing about GitHub's schedules:
#   * they only run from the default branch (main)
#   * GitHub switches them off after 60 days with no activity in the repo, and
#     emails you when it does. Pushing any commit turns them back on.
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]        # redeploy straight away when you change the app
    # Ignore the bot's own commits, so a run can't retrigger itself. The commit
    # message also carries [skip ci]; this is the belt to that pair of braces.
    paths-ignore: ["**.md", "posts.json"]
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

# Only one run at a time, so two runs can't both try to commit posts.json.
concurrency:
  group: update-posts
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit posts.json back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new posts from Telegram
        env:
          TG_CHANNEL: fabrizioromanotg
          MAX_POSTS: "800"
          BACKFILL_PAGES: "15"    # only used on a cold start, ~300 posts
        run: python3 fetch_posts.py

      - name: Commit posts.json if it changed
        run: |
          if git diff --quiet -- posts.json; then
            echo "no change — nothing to commit"
            exit 0
          fi
          git config user.name  "romano-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "posts: $(python3 -c 'import json;print(len(json.load(open("posts.json"))))') total [skip ci]"
          # another run may have pushed while we were working — rebase and retry
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push failed, retry $i"; sleep 5
          done
          exit 1

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}       # pick up the commit the fetch job just made
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
